[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arx-d-can"
version = "1.0.2"
description = "Yunyi V1.0 dual-arm Python SDK for the RK3588 Cyclone DDS Runtime service."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cyclonedds==11.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[tool.setuptools]
include-package-data = false
packages = [
  "arx_d_can",
  "arx_d_can.examples",
  "arx_d_can.examples.control",
  "arx_d_can.examples.diagnostics",
  "arx_d_can.examples.maintenance",
  "arx_d_can._dds",
  "arx_d_can.sdk",
  "arx_d_can.service_tools",
]
[tool.setuptools.package-data]
arx_d_can = ["examples/README.md", "models/*.urdf"]
