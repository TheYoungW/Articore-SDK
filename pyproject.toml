[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arx-d-can"
version = "0.3.0"
description = "Yunyi V1.0 dual-arm Python SDK backed by Motor Drive Layer Runtime."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "motor-drive-layer==0.10.21",
  "numpy>=1.23",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[tool.setuptools]
include-package-data = false
packages = [
  "arx_d_can",
  "arx_d_can.examples",
  "arx_d_can.examples.dual_arm",
  "arx_d_can._motor_abi",
  "arx_d_can._motor_abi.cli",
  "arx_d_can.sdk",
  "arx_d_can.service_tools",
]
[tool.setuptools.package-data]
arx_d_can = ["examples/README.md", "models/*.urdf", "_motor_abi/py.typed"]
