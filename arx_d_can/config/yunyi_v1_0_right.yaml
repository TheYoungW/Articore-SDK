name: Yunyi V1.0 Right Arm
urdf_path: models/yunyi_v1_0.urdf
end_effector_frame: r-link7

# 这是右臂的预期 CAN 映射；连接右臂适配器后需进行验证。
channel: /dev/ttyACM1
transport: dm-serial
baud: 1000000
rate: 500

safety:
  watchdog_enabled: true
  command_timeout_s: 0.25
  enable_grace_s: 2.0
  watchdog_poll_s: 0.02
  watchdog_action: safe_hold
  safe_hold_hz: 100.0
  feedback_fault_threshold: 3

groups:
  arm:
    joints:
      [r-joint1, r-joint2, r-joint3, r-joint4, r-joint5, r-joint6, r-joint7]
  gripper:
    joints: [r-gripper]

gripper_mapping:
  closed_value: 0.0
  open_value: 2.64

gripper_force_control:
  enabled: true
  close_speed: 1.0
  contact_torque: 0.8
  overload_torque: 1.5
  motion_window_s: 0.2
  stall_movement: 0.01
  min_position_error: 0.05
  contact_hold_s: 0.2
  overload_hold_s: 0.05
  hold_offset: 0.08
  retreat_distance: 0.15
  max_step_interval_s: 0.05
  overload_retreat_interval_s: 0.1
  hold_kp: 2.0
  hold_kd: 0.5

# velocity_range 是电机 VMAX 对应的反馈/MIT 映射范围，不是 POS_VEL 的 vlim。
# 初始增益采用现有 ARX 配置中的保守值；负载运行前必须在受支持硬件上验证并调试。
joints:
  # 控制增益按执行器能力分级：joint1～2 为 40 Nm，joint3～4 为 20 Nm，
  # joint5～7 为 8 Nm。
  - name: r-joint1
    motor_id: 0x01
    feedback_id: 0x11
    model: "8009"
    torque_range: 40.0
    velocity_range: 10.0
    direction: -1
    MIT: {kp: 120.0, kd: 8.0}
    POS_VEL: {vel_kp: 0.010, vel_ki: 0.0025, pos_kp: 100.0, pos_ki: 0.3, vlim: 7.0}

  - name: r-joint2
    motor_id: 0x02
    feedback_id: 0x12
    model: "8009"
    torque_range: 40.0
    velocity_range: 10.0
    MIT: {kp: 120.0, kd: 8.0}
    POS_VEL: {vel_kp: 0.008, vel_ki: 0.002, pos_kp: 80.0, pos_ki: 0.2, vlim: 7.0}

  - name: r-joint3
    motor_id: 0x03
    feedback_id: 0x13
    model: "4340P"
    torque_range: 20.0
    velocity_range: 10.0
    MIT: {kp: 60.0, kd: 4.0}
    POS_VEL: {vel_kp: 0.0125, vel_ki: 0.001, pos_kp: 165.0, pos_ki: 0.0, vlim: 5.0}

  - name: r-joint4
    motor_id: 0x04
    feedback_id: 0x14
    model: "4340P"
    torque_range: 20.0
    velocity_range: 10.0
    MIT: {kp: 100.0, kd: 4.0}
    POS_VEL: {vel_kp: 0.0125, vel_ki: 0.001, pos_kp: 180.0, pos_ki: 0.0, vlim: 5.0}

  - name: r-joint5
    motor_id: 0x05
    feedback_id: 0x15
    model: "4310"
    torque_range: 8.0
    velocity_range: 10.0
    MIT: {kp: 18.0, kd: 2.0}
    POS_VEL: {vel_kp: 0.006, vel_ki: 0.0015, pos_kp: 80.0, pos_ki: 0.2, vlim: 3.0}

  - name: r-joint6
    motor_id: 0x06
    feedback_id: 0x16
    model: "4310"
    torque_range: 8.0
    velocity_range: 10.0
    direction: -1
    MIT: {kp: 18.0, kd: 2.0}
    POS_VEL: {vel_kp: 0.006, vel_ki: 0.0015, pos_kp: 80.0, pos_ki: 0.2, vlim: 3.0}

  - name: r-joint7
    motor_id: 0x07
    feedback_id: 0x17
    model: "4310"
    torque_range: 8.0
    velocity_range: 10.0
    direction: -1
    MIT: {kp: 18.0, kd: 2.0}
    POS_VEL: {vel_kp: 0.006, vel_ki: 0.0015, pos_kp: 80.0, pos_ki: 0.2, vlim: 3.0}

  - name: r-gripper
    motor_id: 0x08
    feedback_id: 0x18
    model: "4310"
    velocity_range: 30.0
    MIT: {kp: 4.0, kd: 0.5}
