name: Corina V2
urdf_path: models/Corinav2.urdf
joint_transform_path: models/corina_v2_joint_transform.json
# SDK 当前只公开一个末端坐标系，默认使用右脚。
end_effector_frame: right_leg_link6

channel: /dev/ttyACM0
transport: dm-serial
baud: 1000000
rate: 250

safety:
  watchdog_enabled: true
  command_timeout_s: 0.25
  enable_grace_s: 2.0
  watchdog_poll_s: 0.02
  watchdog_action: safe_hold
  # 安全保持期间，耦合虚拟 PD 循环仍保持相同频率。
  safe_hold_hz: 250.0
  feedback_fault_threshold: 3
  # A/B 缓存反馈超过此数据年龄后，不得再用于踝关节虚拟 PD。
  max_cached_feedback_age_s: 0.05

# 双腿共用一条 CAN 总线。Pinocchio 遍历此分支 URDF 时先处理左腿，因此命令和状态
# 数组按左腿、右腿的顺序排列。
groups:
  arm:
    joints:
      [left_leg_joint1, left_leg_joint2, left_leg_joint3,
       left_leg_joint4, left_leg_joint5, left_leg_joint6,
       right_leg_joint1, right_leg_joint2, right_leg_joint3,
       right_leg_joint4, right_leg_joint5, right_leg_joint6]

# 保守默认值沿用现有 SDK 配置：27 Nm 关节采用 4340P 默认值，7 Nm 关节采用 4310
# 默认值。正常运行前，应在悬空硬件上验证方向、零位和增益。
# 所有 ESC ID 必须位于达妙唯一的 4 位状态 ID 范围内。本机器人每个反馈/MST ID
# 都等于对应 ESC ID 加 0x20。
joints:
  - name: left_leg_joint1
    motor_id: 0x07
    feedback_id: 0x27
    model: "4340P"
    MIT: {kp: 120.0, kd: 8.0}
    POS_VEL: {vel_kp: 0.0125, vel_ki: 0.004, pos_kp: 150.0, pos_ki: 0.5, vlim: 5.0}

  - name: left_leg_joint2
    motor_id: 0x08
    feedback_id: 0x28
    model: "4340P"
    direction: -1
    MIT: {kp: 120.0, kd: 8.0}
    POS_VEL: {vel_kp: 0.0125, vel_ki: 0.004, pos_kp: 150.0, pos_ki: 0.5, vlim: 5.0}

  - name: left_leg_joint3
    motor_id: 0x09
    feedback_id: 0x29
    model: "4310"
    direction: -1
    MIT: {kp: 18.0, kd: 2.0}
    POS_VEL: {vel_kp: 0.0050, vel_ki: 0.002, pos_kp: 50.0, pos_ki: 1.0, vlim: 3.0}

  - name: left_leg_joint4
    motor_id: 0x0A
    feedback_id: 0x2A
    model: "4340P"
    MIT: {kp: 120.0, kd: 8.0}
    POS_VEL: {vel_kp: 0.0125, vel_ki: 0.004, pos_kp: 150.0, pos_ki: 0.5, vlim: 5.0}

  - name: left_leg_joint5
    motor_id: 0x0B
    feedback_id: 0x2B
    model: "4310"
    effort_limit: 7.0
    # 踝关节 Pitch 的逻辑增益；SDK 向电机侧发送零 MIT 增益。
    MIT: {kp: 60.0, kd: 1.5}
    POS_VEL: {vel_kp: 0.0050, vel_ki: 0.002, pos_kp: 50.0, pos_ki: 1.0, vlim: 3.0}

  - name: left_leg_joint6
    motor_id: 0x0C
    feedback_id: 0x2C
    model: "4310"
    effort_limit: 7.0
    # 踝关节 Roll 的逻辑增益；SDK 向电机侧发送零 MIT 增益。
    MIT: {kp: 30.0, kd: 0.8}
    POS_VEL: {vel_kp: 0.0050, vel_ki: 0.002, pos_kp: 50.0, pos_ki: 1.0, vlim: 3.0}

  - name: right_leg_joint1
    motor_id: 0x01
    feedback_id: 0x21
    model: "4340P"
    direction: -1
    MIT: {kp: 120.0, kd: 8.0}
    POS_VEL: {vel_kp: 0.0125, vel_ki: 0.004, pos_kp: 150.0, pos_ki: 0.5, vlim: 5.0}

  - name: right_leg_joint2
    motor_id: 0x02
    feedback_id: 0x22
    model: "4340P"
    direction: -1
    MIT: {kp: 120.0, kd: 8.0}
    POS_VEL: {vel_kp: 0.0125, vel_ki: 0.004, pos_kp: 150.0, pos_ki: 0.5, vlim: 5.0}

  - name: right_leg_joint3
    motor_id: 0x03
    feedback_id: 0x23
    model: "4310"
    direction: -1
    MIT: {kp: 18.0, kd: 2.0}
    POS_VEL: {vel_kp: 0.0050, vel_ki: 0.002, pos_kp: 50.0, pos_ki: 1.0, vlim: 3.0}

  - name: right_leg_joint4
    motor_id: 0x04
    feedback_id: 0x24
    model: "4340P"
    direction: -1
    MIT: {kp: 120.0, kd: 8.0}
    POS_VEL: {vel_kp: 0.0125, vel_ki: 0.004, pos_kp: 150.0, pos_ki: 0.5, vlim: 5.0}

  - name: right_leg_joint5
    motor_id: 0x05
    feedback_id: 0x25
    model: "4310"
    effort_limit: 7.0
    # Pitch 逻辑增益；物理电机 Kp/Kd 保持为零。COUPLED.motor_kd 根据滤波反馈计算，
    # 并受总力矩限制约束。
    MIT: {kp: 60.0, kd: 1.5}
    COUPLED:
      {effort_limit: 1.2, motor_kd: 0.4, velocity_filter_s: 0.02,
       torque_rise_rate: 24.0, hold_torque_rise_rate: 1.0,
       torque_brake_rate: 200.0}
    POS_VEL: {vel_kp: 0.0050, vel_ki: 0.002, pos_kp: 50.0, pos_ki: 1.0, vlim: 3.0}

  - name: right_leg_joint6
    motor_id: 0x06
    feedback_id: 0x26
    model: "4310"
    effort_limit: 7.0
    # Roll 逻辑增益；物理电机 Kp/Kd 保持为零。COUPLED.motor_kd 根据滤波反馈计算，
    # 并受总力矩限制约束。
    MIT: {kp: 30.0, kd: 0.8}
    COUPLED:
      {effort_limit: 1.2, motor_kd: 0.4, velocity_filter_s: 0.02,
       torque_rise_rate: 24.0, hold_torque_rise_rate: 1.0,
       torque_brake_rate: 200.0}
    POS_VEL: {vel_kp: 0.0050, vel_ki: 0.002, pos_kp: 50.0, pos_ki: 1.0, vlim: 3.0}
