name: ARX-D-CAN
urdf_path: models/Alicia_M_1_2_follower_ARX.urdf
end_effector_frame: tool0

channel: /dev/ttyACM0
transport: dm-serial
baud: 1000000
rate: 500

safety:
  command_timeout_s: 0.25
  enable_grace_s: 2.0
  safe_hold_hz: 100.0
  feedback_fault_threshold: 3

groups:
  arm:
    joints: [joint1, joint2, joint3, joint4, joint5, joint6]
  gripper:
    joints: [gripper]

joints:
  - name: joint1
    motor_id: 0x01
    feedback_id: 0x11
    model: "4340P"
    MIT:
      kp: 120.0
      kd: 5.0
    POS_VEL:
      vel_kp: 0.0125
      vel_ki: 0.004
      pos_kp: 150.0
      pos_ki: 0.5
      vlim: 5.0

  - name: joint2
    motor_id: 0x02
