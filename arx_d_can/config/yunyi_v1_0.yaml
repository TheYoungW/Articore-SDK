name: Yunyi V1.0
urdf_path: models/yunyi_v1_0.urdf
# Yunyi 默认使用刷入 gs_usb 固件的 DM-USB2FDCAN Dual：左臂 can0、右臂 can1。
# CAN-FD 的 1 Mbps/5 Mbps 位时序由 Linux ip link 预先配置，SDK 显式开启 BRS。
transport: socketcanfd
# motor-drive-layer 0.10.8 的非阻塞 raw mailbox 和内部快照锁缓存路径已完成双臂真机
# 验收：公开 SDK raw MIT 以 500 Hz 持续 30 秒，16 台反馈均接近 500 Hz。
rate: 500

# ABI 2.5：URDF 限位作为机械硬限位；普通位置 reference 在两端各预留 1°。
joint_safety:
  soft_limit_margin: 0.01745329252
  soft_limit_braking_zone: 0.08726646260
  braking_acceleration: 2.0

safety:
  command_timeout_s: 0.25
  enable_grace_s: 2.0
  safe_hold_hz: 100.0
  safe_hold_pv_velocity_limit: 0.2
  safe_hold_mit_kp: 5.0
  safe_hold_mit_kd: 1.0
  safe_hold_failure_threshold: 1
  feedback_check_hz: 100.0
  feedback_fault_threshold: 3
  # 300 ms 窗口容纳双通道 16 电机在 raw MIT 下的反馈短时中断；
  # 连续 3 次健康检查失败才判定故障。
  max_cached_feedback_age_s: 0.3
  # 进程整体退出时原生线程也会消失，由电机固件通信超时完成最终失能。
  motor_communication_timeout_ms: 500
# 映射、速度、十档力控和全部保护参数由 motor 内置产品 profile 提供。
gripper_profile: yunyi_gripper_v1

# 左右臂是两条独立 CAN 通道，因此可以复用相同 CAN ID：关节 0x01～0x07，夹爪 0x08。
# 两侧各自固定 7 个关节；双臂命令不会展平成 14 轴。
# PV 增益按双臂伸展姿态真机标定：禁用两级积分，避免固定目标附近的持续振荡；
# J1/J2/J5-J7 降低位置环比例，限制追赶和制动过冲。左右臂保持镜像同参。
# 机械臂 MIT 增益使用 OpenArm 默认安全组；夹爪仍使用 Yunyi 独立安全策略。
arms:
  left:
    name: Yunyi V1.0 Left Arm
    channel: can0
    end_effector_frame: l-link7
    # 普通 MIT 增益当前按左右臂镜像配置；真机标定结果需在完整目标姿态下分别复核。
    groups:
      arm:
        joints: [l-joint1, l-joint2, l-joint3, l-joint4, l-joint5, l-joint6, l-joint7]
      gripper:
        joints: [l-gripper]
    joints:
      - name: l-joint1
        motor_id: 0x01
        feedback_id: 0x11
        model: "8009"
        torque_range: 40.0
        velocity_range: 20.0
        direction: 1
        MIT: {kp: 190.0, kd: 4.55}
        POS_VEL: {vel_kp: 0.010, vel_ki: 0.0, pos_kp: 60.0, pos_ki: 0.0, vlim: 16.0}
      - name: l-joint2
        motor_id: 0x02
