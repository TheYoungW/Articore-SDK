name: Yunyi V1.0
urdf_path: models/yunyi_v1_0.urdf
# Yunyi 标配 DM-USB2FDCAN Dual 原厂固件，左臂 CH0、右臂 CH1。
transport: dm-device
baud: 1000000
rate: 500

# ABI 2.0：URDF 限位作为机械硬限位；普通位置 reference 在两端各预留 1°。
joint_safety:
  soft_limit_margin: 0.01745329252
  soft_limit_braking_zone: 0.08726646260
  braking_acceleration: 2.0

safety:
  command_timeout_s: 0.25
  enable_grace_s: 2.0
  safe_hold_hz: 100.0
  safe_hold_pv_velocity_limit: 0.2
  safe_hold_mit_kp: 5.0
  safe_hold_mit_kd: 1.0
  safe_hold_failure_threshold: 1
  feedback_check_hz: 100.0
  feedback_fault_threshold: 3
  # 双通道 16 电机在使能切换附近可能出现超过 50 ms 的短暂反馈间隔。
  max_cached_feedback_age_s: 0.1
  # 进程整体退出时原生线程也会消失，由电机固件通信超时完成最终失能。
  motor_communication_timeout_ms: 500
  # 普通故障优先低刚度保持物体；保持失败时自动尝试失能。
  gripper_fault_action: hold

gripper_mapping:
  closed_value: 0.0
  open_value: 2.64

# 夹爪始终使用 MIT 模式，默认 Kp=4.0；保护逻辑由 motor 原生运行时执行。
gripper_protection:
  # ABI 兼容字段；Runtime 2.0 正常运行时实际跟随整机 500 Hz。
  control_hz: 500.0
  # 张开/闭合双向斜坡的产品最大标定速度；公开 speed=1000 对应 5.0 rad/s。
  close_speed: 5.0
  contact_torque: 0.8
  overload_torque: 1.5
  motion_window_s: 0.2
  stall_movement: 0.01
  min_position_error: 0.05
  contact_hold_s: 0.2
  overload_hold_s: 0.05
  hold_offset: 0.08
  retreat_distance: 0.15
  max_step_interval_s: 0.05
  overload_retreat_interval_s: 0.1
  hold_kp: 2.0
  hold_kd: 0.5
  # 1 最轻、5 默认、10 最强；每档底层阈值与增益都由产品标定。
  force_profiles:
    level_1:  {contact_torque: 0.5,   overload_torque: 1.0,   moving_kp: 3.0,  moving_kd: 0.3,  hold_kp: 1.0,  hold_kd: 0.2}
    level_2:  {contact_torque: 0.575, overload_torque: 1.125, moving_kp: 3.25, moving_kd: 0.35, hold_kp: 1.25, hold_kd: 0.275}
    level_3:  {contact_torque: 0.65,  overload_torque: 1.25,  moving_kp: 3.5,  moving_kd: 0.4,  hold_kp: 1.5,  hold_kd: 0.35}
    level_4:  {contact_torque: 0.725, overload_torque: 1.375, moving_kp: 3.75, moving_kd: 0.45, hold_kp: 1.75, hold_kd: 0.425}
    level_5:  {contact_torque: 0.8,   overload_torque: 1.5,   moving_kp: 4.0,  moving_kd: 0.5,  hold_kp: 2.0,  hold_kd: 0.5}
    level_6:  {contact_torque: 0.88,  overload_torque: 1.6,   moving_kp: 4.4,  moving_kd: 0.56, hold_kp: 2.2,  hold_kd: 0.54}
    level_7:  {contact_torque: 0.96,  overload_torque: 1.7,   moving_kp: 4.8,  moving_kd: 0.62, hold_kp: 2.4,  hold_kd: 0.58}
    level_8:  {contact_torque: 1.04,  overload_torque: 1.8,   moving_kp: 5.2,  moving_kd: 0.68, hold_kp: 2.6,  hold_kd: 0.62}
    level_9:  {contact_torque: 1.12,  overload_torque: 1.9,   moving_kp: 5.6,  moving_kd: 0.74, hold_kp: 2.8,  hold_kd: 0.66}
    level_10: {contact_torque: 1.2,   overload_torque: 2.0,   moving_kp: 6.0,  moving_kd: 0.8,  hold_kp: 3.0,  hold_kd: 0.7}

# 左右臂是两条独立 CAN 通道，各自固定 7 个关节；双臂命令不会展平成 14 轴。
# PV 增益按双臂伸展姿态真机标定：禁用两级积分，避免固定目标附近的持续振荡；
# J1/J2/J5-J7 降低位置环比例，限制追赶和制动过冲。左右臂保持镜像同参。
# 机械臂 MIT 增益使用 OpenArm 默认安全组；夹爪仍使用 Yunyi 独立安全策略。
arms:
  left:
    name: Yunyi V1.0 Left Arm
    channel: "0"
    end_effector_frame: l-link7
    # 普通 MIT 增益当前按左右臂镜像配置；真机标定结果需在完整目标姿态下分别复核。
    groups:
      arm:
        joints: [l-joint1, l-joint2, l-joint3, l-joint4, l-joint5, l-joint6, l-joint7]
      gripper:
        joints: [l-gripper]
    joints:
      - name: l-joint1
        motor_id: 0x09
        feedback_id: 0x19
        model: "8009"
        torque_range: 40.0
        velocity_range: 20.0
        direction: 1
        MIT: {kp: 190.0, kd: 4.55}
        POS_VEL: {vel_kp: 0.010, vel_ki: 0.0, pos_kp: 60.0, pos_ki: 0.0, vlim: 16.0}
      - name: l-joint2
        motor_id: 0x0A
        feedback_id: 0x1A
        model: "8009"
        torque_range: 40.0
        velocity_range: 20.0
        MIT: {kp: 190.0, kd: 4.5}
        POS_VEL: {vel_kp: 0.008, vel_ki: 0.0, pos_kp: 50.0, pos_ki: 0.0, vlim: 16.0}
      - name: l-joint3
