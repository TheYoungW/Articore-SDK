        POS_VEL: {vel_kp: 0.0125, vel_ki: 0.0, pos_kp: 180.0, pos_ki: 0.0, vlim: 5.0}
      - name: l-joint5
        motor_id: 0x0D
        feedback_id: 0x1D
        model: "4310"
        torque_range: 7.0
        velocity_range: 10.0
        direction: -1
