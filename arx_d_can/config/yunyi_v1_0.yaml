        torque_range: 27.0
        velocity_range: 10.0
        MIT: {kp: 70.0, kd: 2.0}
        POS_VEL: {vel_kp: 0.0125, vel_ki: 0.0, pos_kp: 165.0, pos_ki: 0.0, vlim: 5.0}
      - name: l-joint4
